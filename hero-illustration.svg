<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="50" y1="20" x2="250" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#99141F"/>
      <stop offset="100%" stop-color="#790D16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="160" y1="80" x2="520" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5EFE1"/>
      <stop offset="100%" stop-color="#E5D3AF"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCE7EE"/>
      <stop offset="100%" stop-color="#AEC4D4"/>
    </linearGradient>
    <filter id="cardShadow" x="140" y="60" width="400" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#790D16" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Glow Circles -->
  <circle cx="160" cy="180" r="140" fill="#E5D3AF" opacity="0.3"/>
  <circle cx="390" cy="190" r="120" fill="#AEC4D4" opacity="0.25"/>

  <!-- Code Card / Context Window Preview (Backdrop) -->
  <g filter="url(#cardShadow)">
    <rect x="170" y="70" width="340" height="250" rx="18" fill="#FFFFFF" stroke="#E5D3AF" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect x="170" y="70" width="340" height="38" rx="18" fill="#F5EFE1"/>
    <circle cx="194" cy="89" r="5" fill="#790D16"/>
    <circle cx="210" cy="89" r="5" fill="#E5D3AF"/>
    <circle cx="226" cy="89" r="5" fill="#AEC4D4"/>
    <text x="250" y="93" font-family="monospace" font-size="11" fill="#790D16" font-weight="600">mini-ask.py • sanitized</text>

    <!-- Code Lines inside -->
    <rect x="195" y="126" width="140" height="10" rx="5" fill="#790D16" opacity="0.8"/>
    <rect x="345" y="126" width="90" height="10" rx="5" fill="#AEC4D4"/>
    <rect x="195" y="148" width="220" height="10" rx="5" fill="#E5D3AF"/>
    
    <!-- Redacted Secret Pill (Highlights local privacy protection) -->
    <rect x="195" y="170" width="260" height="24" rx="6" fill="#790D16" opacity="0.08"/>
    <rect x="205" y="176" width="130" height="12" rx="4" fill="#790D16"/>
    <text x="210" y="185" font-family="monospace" font-size="9" fill="#F5EFE1" font-weight="bold">[REDACTED_API_KEY]</text>
    <rect x="345" y="177" width="90" height="10" rx="5" fill="#AEC4D4"/>

    <!-- Solution / Output Card -->
    <rect x="195" y="210" width="290" height="85" rx="10" fill="#FAF6ED" stroke="#AEC4D4" stroke-width="1.2"/>
    <circle cx="215" cy="230" r="7" fill="#790D16"/>
    <path d="M213 230l1.5 1.5 3-3" stroke="#F5EFE1" stroke-width="1.5" stroke-linecap="round"/>
    <text x="230" y="234" font-family="sans-serif" font-size="11" font-weight="bold" fill="#790D16">Heuristic Diagnosis &amp; Fix Verified</text>
    <rect x="215" y="248" width="250" height="8" rx="4" fill="#AEC4D4" opacity="0.7"/>
    <rect x="215" y="264" width="180" height="8" rx="4" fill="#E5D3AF"/>
    <rect x="215" y="278" width="120" height="8" rx="4" fill="#790D16" opacity="0.5"/>
  </g>

  <!-- Big Privacy Shield (Foreground Left) -->
  <g transform="translate(40, 70)">
    <path d="M75 10 L140 38 C140 120 75 165 75 165 C75 165 10 120 10 38 Z" fill="url(#shieldGrad)" stroke="#E5D3AF" stroke-width="3"/>
    <!-- Inner Accent -->
    <path d="M75 24 L126 48 C126 114 75 151 75 151 C75 151 24 114 24 48 Z" fill="none" stroke="#F5EFE1" stroke-width="1.5" opacity="0.6"/>
    <!-- Lock / Sparkle inside shield -->
    <rect x="62" y="80" width="26" height="22" rx="4" fill="#F5EFE1"/>
    <path d="M67 80 V70 C67 65.5 71 62 75 62 C79 62 83 65.5 83 70 V80" stroke="#F5EFE1" stroke-width="3" fill="none"/>
    <circle cx="75" cy="91" r="2.5" fill="#790D16"/>
    <!-- Floating status badge -->
    <rect x="20" y="172" width="110" height="24" rx="12" fill="#F5EFE1" stroke="#AEC4D4" stroke-width="1.5"/>
    <circle cx="32" cy="184" r="4" fill="#790D16"/>
    <text x="42" y="188" font-family="sans-serif" font-size="10" font-weight="bold" fill="#790D16">100% Client-Side</text>
  </g>

  <!-- Floating Hotkey Capsule -->
  <g transform="translate(360, 40)">
    <rect width="130" height="34" rx="17" fill="#790D16" stroke="#E5D3AF" stroke-width="1.5"/>
    <text x="18" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#F5EFE1">Alt + Space</text>
  </g>
</svg>
