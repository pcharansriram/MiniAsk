<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none">
  <!-- MiniAsk Brand Logo -->
  <defs>
    <linearGradient id="maroonGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#99141F"/>
      <stop offset="100%" stop-color="#790D16"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCE7EE"/>
      <stop offset="100%" stop-color="#AEC4D4"/>
    </linearGradient>
  </defs>

  <!-- Icon Mark -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#maroonGrad)" stroke="#E5D3AF" stroke-width="1.5"/>
  <!-- Speech / Prompt Bubble with Ask sparkle -->
  <path d="M16 16h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-9l-4 4v-4h-3a2 2 0 0 1-2-2V18a2 2 0 0 1 2-2z" fill="#F5EFE1" opacity="0.95"/>
  <!-- Question / Sparkle element -->
  <path d="M24 19a2.5 2.5 0 0 1 2.5 2.5c0 1.25-1.5 1.75-1.5 2.5m0 2.5v.5" stroke="#790D16" stroke-width="2" stroke-linecap="round"/>
  <!-- Shield privacy indicator dot -->
  <circle cx="34" cy="14" r="3" fill="#AEC4D4" stroke="#F5EFE1" stroke-width="1"/>

  <!-- Brand Typography -->
  <text x="56" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="currentColor" letter-spacing="-0.5">Mini<tspan fill="#790D16">Ask</tspan></text>
  <text x="57" y="39" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#AEC4D4" letter-spacing="1.2">PRIVACY Q&amp;A</text>
</svg>
